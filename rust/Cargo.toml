[workspace]
resolver = "2"
members = [
    "crates/weightx-core",
    "crates/weightx-agent",
    "crates/wx-cli",
    "crates/weightx-desktop",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["WeightX Contributors"]

[workspace.dependencies]
weightx-core = { path = "crates/weightx-core" }
weightx-agent = { path = "crates/weightx-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ndarray = "0.16"
nalgebra = "0.33"
indexmap = { version = "2", features = ["serde"] }
safetensors = "0.5"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
regex = "1"
thiserror = "2"
anyhow = "1"
dirs = "5"
glob = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
cersei-provider = "0.2.6"
cersei-types = "0.2.6"
hf-hub = "0.4"
tokenizers = "0.21"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1