        <button class="nav-item" data-view="tensors"><svg class="icon"><use href="#i-box"/></svg><span class="nav-label">Тензоры</span><span class="nav-badge" id="navTensorsBadge" hidden></span><span class="kbd-hint">2</span></button>
        <button class="nav-item" data-view="diagnostics"><svg class="icon"><use href="#i-activity"/></svg><span class="nav-label">Диагностика</span><span class="kbd-hint">3</span></button>
        <button class="nav-item" data-view="yaml"><svg class="icon"><use href="#i-file-code"/></svg><span class="nav-label">YAML-план</span><span class="kbd-hint">4</span></button>
        <button class="nav-item" data-view="history"><svg class="icon"><use href="#i-history"/></svg><span class="nav-label">История</span><span class="nav-badge" id="navHistoryBadge" hidden></span><span class="kbd-hint">5</span></button>
        <div class="nav-group-label" style="margin-top:6px">Окружение</div>
        <button class="nav-item" data-view="models"><svg class="icon"><use href="#i-layers"/></svg><span class="nav-label">Модели</span><span class="kbd-hint">6</span></button>
        <button class="nav-item" data-view="provider"><svg class="icon"><use href="#i-brain"/></svg><span class="nav-label">Провайдер</span><span class="kbd-hint">7</span></button>
      </nav>
      <div class="sidebar-status" id="sidebarStatus"></div>
      <div class="side-foot">
        <button class="nav-item" data-view="settings"><svg class="icon"><use href="#i-settings"/></svg><span class="nav-label">Настройки</span><span class="kbd-hint">8</span></button>
        <button class="nav-item" data-view="hotkeys"><svg class="icon"><use href="#i-keyboard"/></svg><span class="nav-label">Горячие клавиши</span><span class="kbd-hint">9</span></button>
        <button class="nav-item" id="sidebarCollapse" data-tip="Свернуть <span class='tt-kbd'>Ctrl B</span>"><svg class="icon"><use href="#i-panel-left"/></svg><span class="nav-label">Свернуть</span></button>
        <button class="nav-item" id="sidebarHide" data-tip="Скрыть сайдбар · наведение на левый край вернёт его"><svg class="icon"><use href="#i-eye-off"/></svg><span class="nav-label">Скрыть</span></button>
      </div>
    </aside>
    <div class="side-edge" id="sideEdge" aria-hidden="true">
      <button class="side-edge-grip" id="sideEdgeGrip" data-tip="Показать сайдбар" aria-label="Показать сайдбар"><svg class="icon"><use href="#i-panel-left"/></svg></button>
    </div>

    <main class="main" data-component="main">
      <section class="view is-active" id="view-session" data-component="view-session"></section>
      <section class="view" id="view-tensors" data-component="view-tensors"></section>
      <section class="view" id="view-diagnostics" data-component="view-diagnostics"><div class="view-scroll"><div class="view-pad" id="diagPad"></div></div></section>
      <section class="view" id="view-yaml" data-component="view-yaml"></section>
      <section class="view" id="view-history" data-component="view-history"><div class="view-scroll"><div class="view-pad" id="historyPad"></div></div></section>
      <section class="view" id="view-models" data-component="view-models"><div class="view-scroll"><div class="view-pad" id="modelsPad"></div></div></section>
      <section class="view" id="view-provider" data-component="view-provider"><div class="view-scroll"><div class="view-pad" id="providerPad"></div></div></section>
      <section class="view" id="view-settings" data-component="view-settings"><div class="view-scroll"><div class="view-pad" id="settingsPad"></div></div></section>
      <section class="view" id="view-hotkeys" data-component="view-hotkeys"><div class="view-scroll"><div class="view-pad" id="hotkeysPad"></div></div></section>
    </main>

    <aside class="inspector" data-component="inspector">
      <div class="panel-header"><svg class="icon"><use href="#i-eye"/></svg><span class="panel-title">Инспектор</span><span class="spacer"></span><button class="btn btn-icon btn-ghost btn-sm" id="inspectorClose" aria-label="Закрыть"><svg class="icon"><use href="#i-x"/></svg></button></div>
      <div class="inspector-body" id="inspectorBody"></div>
    </aside>
  </div>

  <footer class="statusbar" data-component="statusbar">
    <span class="sb-item"><svg class="icon"><use href="#i-cpu"/></svg><strong id="sbBackend">Rust core</strong></span>
    <span class="sb-item"><svg class="icon"><use href="#i-layers"/></svg><strong id="sbParams">—</strong></span>
    <span class="sb-item"><svg class="icon"><use href="#i-brain"/></svg><strong id="sbProvider">мозг: —</strong></span>
    <span class="sb-item"><span class="dot dot-success" id="sbSandboxDot"></span><span id="sbSandbox">sandbox</span></span>
    <span class="sb-spacer"></span>
    <span class="sb-item"><svg class="icon" style="color:var(--status-success)"><use href="#i-shield"/></svg><strong id="sbVespasian">Vespasian активен</strong></span>
    <span class="sb-item"><span class="sb-chip" id="sbEngine" data-tip="Нативный движок WeightX: Rust core + PyTorch sidecar для тяжёлых вычислений">движок WeightX</span></span>
    <span class="sb-item mono" id="sbClock">--:--</span>
  </footer>
  <div class="side-backdrop" id="sideBackdrop"></div>
</div>
<div class="styles-pop" id="stylesPop" role="dialog" aria-label="Стили оформления">
  <div class="sp-title">Стиль оформления</div>
  <div class="styles-grid" id="stylesPopGrid"></div>
  <div class="sp-title" style="margin-top:12px">Интерактивный фон</div>
  <div class="bg-mode-chips" id="bgPopGrid"></div>
</div>
<div class="brain-pop" id="brainPop" role="dialog" aria-label="Модель Brain">
  <div class="bp-head">
    <div class="bp-title"><svg class="icon"><use href="#i-brain"/></svg> Модель Brain</div>
    <div class="bp-sub">Только провайдеры, подключённые к WeightX</div>
    <div class="bp-search"><svg class="icon"><use href="#i-search"/></svg><input id="brainSearch" placeholder="Поиск модели…" autocomplete="off" /></div>
  </div>
  <div class="bp-list" id="brainList"></div>
  <div class="bp-foot"><button class="btn btn-sm" id="brainManage"><svg class="icon"><use href="#i-network"/></svg> Подключения провайдеров</button></div>
</div>
<div class="select-pop" id="selectPop" role="listbox" aria-label="Выбор значения"></div>
<div class="overlay cmdk" id="cmdk" role="dialog" aria-modal="true" aria-label="Командная палитра">
  <div class="overlay-backdrop" data-close="cmdk"></div>
  <div class="cmdk-panel">
    <div class="cmdk-input-wrap"><svg class="icon"><use href="#i-search"/></svg><input class="cmdk-input" id="cmdkInput" placeholder="Команда, навык, модель или экран…" autocomplete="off" spellcheck="false" /><kbd class="kbd">Esc</kbd></div>
    <div class="cmdk-results" id="cmdkResults"></div>
    <div class="cmdk-foot"><span><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> навигация</span><span><kbd class="kbd">↵</kbd> выполнить</span><span><kbd class="kbd">Esc</kbd> закрыть</span></div>
  </div>
</div>
<div class="overlay dialog-wrap" id="dialog" role="dialog" aria-modal="true">
  <div class="overlay-backdrop" data-close="dialog"></div>
  <div class="dialog">
    <div class="dialog-header"><div class="dialog-title" id="dialogTitle"></div><div class="dialog-desc" id="dialogDesc"></div></div>
    <div class="dialog-body" id="dialogBody"></div>
    <div class="dialog-footer" id="dialogFooter"></div>
  </div>
</div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip"></div>
<div class="chart-tip" id="chartTip"></div>
<script src="app.js"></script>
</body>
</html>
